[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_tenant_fence"
version = "0.1.0"
description = "Audit retrieval traces for cross-tenant document exposure and missing provenance."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ahmed Areeb"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]

[project.scripts]
rag-fence-audit = "tool:main"

[tool.setuptools]
py-modules = ["tool"]
